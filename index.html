<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="D'Origen Provisioning — Yacht &amp; boat provisioning in Maó, Menorca. Gourmet products, Menorcan wines, cheeses and charcuterie delivered to your berth. Curated by sommelier Sara Sanchís.">
<meta property="og:title" content="D'Origen Provisioning · Maó, Menorca">
<meta property="og:description" content="On-board provisioning with the finest Menorcan and gourmet products, delivered to your marina.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dorigen-menorca.com">
<meta property="og:image" content="https://dorigen-menorca.com/logo-hero.webp">
<link rel="preload" as="image" href="logo-dark.webp">
<title>D'Origen Provisioning · Maó, Menorca</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init("A6AKO1xl5c_gh6cpt");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#FFF9F3;font-family:'Cormorant Garamond',Georgia,serif;color:#333A32;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#C9A96E;border-radius:2px;}

/* LANGUAGE SELECTOR */
.lang-screen{position:fixed;inset:0;background:#1C2820;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;transition:opacity .5s ease;}
.lang-screen.hidden{opacity:0;pointer-events:none;}
.lang-logo{width:min(300px,70vw);}
.lang-subtitle{font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.28em;color:#C9A96E;text-transform:uppercase;}
.lang-buttons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.lang-btn{background:none;border:1px solid rgba(201,169,110,.4);color:#F2D3B1;font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:14px 32px;cursor:pointer;transition:all .2s;}
.lang-btn:hover{background:#C9A96E;color:#1C2820;border-color:#C9A96E;}
.lang-flag{font-size:22px;display:block;margin-bottom:6px;}

/* LANG SWITCHER in nav */
.lang-switch{display:flex;gap:0;margin-left:auto;border:1px solid rgba(51,58,50,.15);height:100%;}
.lsw-btn{background:none;border:none;padding:0 12px;font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8A9088;cursor:pointer;transition:all .2s;border-bottom:2px solid transparent;}
.lsw-btn.on{color:#333A32;background:rgba(201,169,110,.1);}
.lsw-btn:hover{color:#C9A96E;}

/* MAIN */
.hero{background:#1C2820;color:#F2D3B1;min-height:68vh;display:flex;flex-direction:column;justify-content:flex-end;padding:48px;position:relative;overflow:hidden;}
.lbl{font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.28em;color:#C9A96E;text-transform:uppercase;}
.nav-bar{background:#fff;border-bottom:1px solid rgba(51,58,50,.1);padding:0 40px;display:flex;overflow-x:auto;position:sticky;top:0;z-index:90;-webkit-overflow-scrolling:touch;align-items:stretch;scrollbar-width:none;-ms-overflow-style:none;}.nav-bar::-webkit-scrollbar{display:none;}
.nbtn{background:none;border:none;border-bottom:2px solid transparent;padding:14px 14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8A9088;white-space:nowrap;cursor:pointer;font-family:'Raleway',sans-serif;transition:all .2s;}
.nbtn:hover{color:#C9A96E;}
.nbtn.on{color:#333A32;border-bottom-color:#C9A96E;}
.srch{padding:18px 40px 4px;background:#FFF9F3;}
.srch input{width:100%;max-width:380px;padding:10px 16px;border:1px solid rgba(51,58,50,.18);background:#fff;font-size:15px;color:#333A32;font-family:'Cormorant Garamond',Georgia,serif;outline:none;transition:border-color .2s;}
.srch input:focus{border-color:#C9A96E;}
.main{padding:14px 40px 110px;max-width:960px;margin:0 auto;}
.card{background:#fff;padding:30px 34px;margin-bottom:10px;border-left:3px solid transparent;transition:border-color .2s,box-shadow .2s;}
.card:hover{border-left-color:#C9A96E;box-shadow:0 2px 20px rgba(28,40,32,.07);}
.sec-img{width:100%;height:200px;object-fit:cover;display:block;margin-bottom:18px;border-radius:2px;}
.sec-img-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.sec-img-pair img{width:100%;height:160px;object-fit:cover;border-radius:2px;}
.sec-note{background:rgba(201,169,110,.08);border-left:3px solid #C9A96E;padding:10px 15px;font-style:italic;font-size:13px;color:#1C2820;margin-bottom:14px;}
.snum{font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.2em;color:#C9A96E;font-weight:700;margin-bottom:4px;}
.stitle{font-size:20px;font-weight:300;letter-spacing:.06em;color:#1C2820;padding-bottom:10px;border-bottom:1px solid #C9A96E;margin-bottom:18px;}
.irow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(51,58,50,.07);}
.irow:last-child{border-bottom:none;}
.iname{flex:1;font-size:14.5px;line-height:1.4;}
.iprice{font-family:'Raleway',sans-serif;font-size:12.5px;font-weight:500;color:#3C0F12;white-space:nowrap;}
.qctrl{display:flex;align-items:center;border:1px solid rgba(51,58,50,.22);height:28px;flex-shrink:0;}
.qbtn{background:none;border:none;width:26px;height:26px;font-size:16px;color:#333A32;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;font-family:'Raleway',sans-serif;}
.qbtn:hover{background:#F2D3B1;}
.qval{font-family:'Raleway',sans-serif;font-size:12px;min-width:22px;text-align:center;}
.abtn{background:none;border:1px solid rgba(51,58,50,.22);padding:3px 11px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#333A32;cursor:pointer;transition:all .15s;height:28px;white-space:nowrap;font-family:'Raleway',sans-serif;}
.abtn:hover{background:#333A32;color:#fff;border-color:#333A32;}
.fab{position:fixed;bottom:24px;right:24px;z-index:200;background:#3C0F12;color:#fff;border:none;border-radius:50px;padding:13px 22px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:10px;box-shadow:0 4px 24px rgba(60,15,18,.35);cursor:pointer;font-family:'Raleway',sans-serif;transition:transform .2s;}
.fab:hover{transform:scale(1.04);}
.badge{background:#C9A96E;color:#1C2820;border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Raleway',sans-serif;}
.ovl{position:fixed;inset:0;background:rgba(28,40,32,.35);z-index:250;opacity:0;pointer-events:none;transition:opacity .3s;}
.ovl.on{opacity:1;pointer-events:auto;}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:#fff;z-index:300;box-shadow:-4px 0 40px rgba(28,40,32,.15);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease;}
.drw.open{transform:translateX(0);}
.drw-head{background:#1C2820;color:#F2D3B1;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.drw-body{flex:1;overflow-y:auto;padding:18px 26px;}
.drw-foot{padding:18px 26px;border-top:1px solid rgba(51,58,50,.1);flex-shrink:0;}
.ci{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid rgba(51,58,50,.08);}
.ci:last-child{border-bottom:none;}
.ci-name{flex:1;font-size:14px;line-height:1.4;}
.ci-price{font-family:'Raleway',sans-serif;font-size:12px;color:#3C0F12;font-weight:500;white-space:nowrap;margin-top:2px;}
.chk{padding:28px 40px 80px;max-width:580px;margin:0 auto;display:none;}
.chk.on{display:block;}
.catalog-wrap{display:block;}
.catalog-wrap.off{display:none;}
.flbl{font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8A9088;display:block;margin-bottom:5px;margin-top:18px;}
.finput{width:100%;padding:10px 14px;border:1px solid rgba(51,58,50,.2);background:#fff;font-size:15px;color:#333A32;font-family:'Cormorant Garamond',Georgia,serif;outline:none;transition:border-color .2s;}
.finput:focus{border-color:#C9A96E;}
.wabtn{background:#25D366;color:#fff;border:none;width:100%;padding:15px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-top:22px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-family:'Raleway',sans-serif;transition:filter .2s;}
.wabtn:hover{filter:brightness(1.08);}
.emailbtn{background:#1C2820;color:#fff;border:none;width:100%;padding:15px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-family:'Raleway',sans-serif;transition:filter .2s;}
.emailbtn:hover{filter:brightness(1.15);}
.timing-notice{background:rgba(201,169,110,.12);border-left:3px solid #C9A96E;padding:12px 16px;margin-top:18px;font-style:italic;font-size:14px;color:#1C2820;line-height:1.5;}
.timing-notice strong{font-style:normal;font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#C9A96E;display:block;margin-bottom:4px;}
.order-btns{display:flex;flex-direction:column;gap:0;margin-top:22px;}
.marina-select{width:100%;padding:10px 14px;border:1px solid rgba(51,58,50,.2);background:#fff;font-size:15px;color:#333A32;font-family:'Cormorant Garamond',Georgia,serif;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none;cursor:pointer;}
.marina-select:focus{border-color:#C9A96E;}
.sending-overlay{position:fixed;inset:0;background:rgba(28,40,32,.6);z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.sending-overlay p{color:#F2D3B1;font-family:'Raleway',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;}
.summary{background:#FFF9F3;border:1px solid rgba(51,58,50,.1);padding:16px 20px;margin-top:10px;}
.sum-row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid rgba(51,58,50,.06);}
.sum-total{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:2px solid #C9A96E;}
.footer{background:#1C2820;color:#F2D3B1;padding:44px 40px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;}
@media(max-width:560px){
  .hero,.footer,.chk{padding-left:22px;padding-right:22px;}
  .nav-bar,.main,.srch{padding-left:18px;padding-right:18px;}
  .card{padding:22px 18px;}
  .footer{grid-template-columns:1fr;}
  .lang-buttons{flex-direction:column;align-items:center;}
}
</style>
</head>
<body>

<!-- LANGUAGE SELECTOR -->
<div class="lang-screen" id="langScreen">
  <img class="lang-logo" src="logo-dark.webp" alt="D'Origen">
  <p class="lang-subtitle">Provisioning & Gourmet Shop · Maó, Menorca</p>
  <div class="lang-buttons">
    <button class="lang-btn" onclick="setLang('ca')">
      <span class="lang-flag" style="font-weight:700;letter-spacing:.04em;">CAT</span>
      Català
    </button>
    <button class="lang-btn" onclick="setLang('en')">
      <span class="lang-flag">🇬🇧</span>
      English
    </button>
    <button class="lang-btn" onclick="setLang('es')">
      <span class="lang-flag">🇪🇸</span>
      Español
    </button>
    <button class="lang-btn" onclick="setLang('fr')">
      <span class="lang-flag">🇫🇷</span>
      Français
    </button>

</div>

<!-- HERO -->
<header class="hero">
  <svg viewBox="0 0 800 500" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
    <path d="M0,120 C180,60 360,200 540,100 C700,10 780,150 800,80 L800,500 L0,500Z" fill="#F2D3B1" opacity=".05"/>
    <path d="M0,280 C200,180 450,360 650,240 C780,160 820,300 800,280 L800,500 L0,500Z" fill="#F2D3B1" opacity=".03"/>
  </svg>
  <div style="position:relative;z-index:2;max-width:820px;">
    <p class="lbl" id="heroLbl" style="margin-bottom:20px;">Provisioning & Gourmet Shop · Maó, Menorca</p>
    <img src="logo-hero.webp" alt="D'Origen" style="width:min(460px,78vw);display:block;margin-bottom:24px;">
    <p id="heroDesc" style="font-size:17px;font-weight:300;font-style:italic;color:rgba(242,211,177,.68);max-width:480px;line-height:1.7;margin-bottom:28px;"></p>
    <span style="font-family:'Raleway',sans-serif;font-size:11px;color:rgba(242,211,177,.45);letter-spacing:.08em;">
      680 495 278 · info@dorigen-menorca.com
    </span>
  </div>
  <p class="lbl" id="heroTagline" style="position:absolute;bottom:36px;right:40px;opacity:.35;font-size:9px;"></p>
</header>

<!-- CATALOG -->
<div class="catalog-wrap" id="catalogWrap">
  <nav class="nav-bar" id="navBar">
    <div class="lang-switch">
      <button class="lsw-btn" id="lswCa" onclick="setLang('ca')">CA</button>
      <button class="lsw-btn" id="lswEn" onclick="setLang('en')">EN</button>
      <button class="lsw-btn" id="lswEs" onclick="setLang('es')">ES</button>
      <button class="lsw-btn" id="lswFr" onclick="setLang('fr')">FR</button>
    </div>
  </nav>
  <div id="timingBanner" style="background:#1C2820;color:#F2D3B1;padding:10px 40px;display:flex;align-items:center;gap:10px;">
  <span style="font-size:16px;">🕐</span>
  <span id="timingBannerText" style="font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.1em;"></span>
</div>
<div class="srch">
    <input type="text" id="searchInput" oninput="renderSections()">
  </div>
  <main class="main" id="sectionsMain"></main>
</div>

<!-- CHECKOUT -->
<div class="chk" id="checkoutWrap">
  <button onclick="showCatalog()" id="backBtn" style="background:none;border:none;font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#8A9088;margin-bottom:22px;display:flex;align-items:center;gap:6px;cursor:pointer;"></button>
  <h2 id="chkTitle" style="font-size:28px;font-weight:300;margin-bottom:4px;"></h2>
  <p id="chkSubtitle" style="font-size:14px;font-style:italic;color:#8A9088;"></p>
  <div class="summary" id="orderSummary"></div>
  <label class="flbl" id="lblDeliveryMethod"></label>
  <select class="marina-select" id="deliveryMethod">
  </select>

  <div id="urgentNotice" style="display:none;background:rgba(60,15,18,.08);border-left:3px solid #3C0F12;padding:11px 15px;font-style:italic;font-size:13px;color:#3C0F12;margin-top:8px;"></div>

  <label class="flbl" id="lblBoat"></label>
  <input class="finput" id="boatName" type="text">
  <label class="flbl" id="lblMarina"></label>
  <select class="marina-select" id="marina">
    <option value="">— Selecciona marinería / Select marina —</option>
    <option value="Marina Port Mahón" data-email="capitania@marinaportmahon.com" data-email2="recepcion@marinaportmahon.com" selected>Marina Port Mahón</option>
    <option value="Club Nàutic de Maó" data-email="">Club Nàutic de Maó</option>
    <option value="Marina del Rei" data-email="operaciones@marinadelrei.com">Marina del Rei</option>
    <option value="Port de Llevant" data-email="reserves@portdellevant.com">Port de Llevant</option>

  <label class="flbl" id="lblDelivery"></label>
  <input class="finput" id="delivery" type="date" min="" onchange="onDeliveryDateChange()">
  <label class="flbl" id="lblDeliverySlot"></label>
  <select class="marina-select" id="deliverySlot"></select>
  <div id="sundayNotice" style="display:none;background:rgba(60,15,18,.08);border-left:3px solid #3C0F12;padding:11px 15px;font-style:italic;font-size:13px;color:#3C0F12;margin-top:8px;"></div>
  <label class="flbl" id="lblPax"></label>
  <input class="finput" id="pax" type="number" min="1">
  <label class="flbl" id="lblNotes"></label>
  <textarea class="finput" id="notes" rows="3" style="resize:vertical;"></textarea>

  <div class="timing-notice">
    <strong id="timingLabel"></strong>
    <span id="timingNotice"></span>
  </div>

  <div class="order-btns">
    <button class="wabtn" onclick="sendWhatsApp()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
      <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.557 4.126 1.532 5.859L0 24l6.305-1.654A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.808 9.808 0 01-5.012-1.377l-.36-.214-3.733.979 1-3.645-.235-.374A9.822 9.822 0 012.182 12C2.182 6.579 6.579 2.182 12 2.182c5.421 0 9.818 4.397 9.818 9.818 0 5.421-4.397 9.818-9.818 9.818z"/>
    </svg>
    <span id="waBtnText"></span>
  </button>
  <button class="emailbtn" onclick="sendEmail()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
      <polyline points="22,6 12,12 2,6"/>
    </svg>
    <span id="emailBtnText"></span>
  </button>
  </div>
</div>
<!-- FAB -->
<button class="fab" id="cartFab" onclick="openDrawer()" style="display:none;">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
    <path d="M16 10a4 4 0 01-8 0"/>
  </svg>
  <span id="fabText"></span>
  <span class="badge" id="cartBadge">0</span>
</button>

<div class="ovl" id="overlay" onclick="closeDrawer()"></div>

<div class="drw" id="drawer">
  <div class="drw-head">
    <div>
      <p class="lbl" style="margin-bottom:4px;">D'Origen Provisioning</p>
      <h3 id="drawerTitle" style="font-size:22px;font-weight:300;"></h3>
    </div>
    <button onclick="closeDrawer()" style="background:none;border:1px solid rgba(242,211,177,.2);color:#F2D3B1;width:32px;height:32px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;">×</button>
  </div>
  <div class="drw-body" id="drawerBody"></div>
  <div class="drw-foot" id="drawerFoot"></div>
</div>

<footer class="footer">
  <div>
    <img src="logo-footer.webp" alt="D'Origen" style="width:min(200px,50vw);display:block;margin-bottom:14px;">
    <p style="font-style:italic;color:rgba(242,211,177,.5);font-size:14px;font-weight:300;line-height:1.7;">Avinguda Fort de l'Eau, 66 · Maó, Menorca</p>
  </div>
  <div style="text-align:right;">
    <p class="lbl" style="margin-bottom:6px;">Sara Sanchís Sommelier</p>
    <a href="tel:+34680495278" style="display:block;color:#F2D3B1;text-decoration:none;font-size:16px;font-weight:300;margin-bottom:4px;">680 495 278</a>
    <a href="mailto:info@dorigen-menorca.com" style="color:rgba(242,211,177,.45);text-decoration:none;font-size:13px;">info@dorigen-menorca.com</a>
    <p class="lbl" style="margin-top:16px;opacity:.3;font-size:8px;" id="footerTagline"></p>
  </div>
</footer>

<script>
const WA = "34680495278";
const fmt = n => n !== null ? n.toFixed(2).replace(".",",") + "€" : "—";

const T = {
  en: {
    heroDesc: "On-board provisioning service with the finest products, curated by sommelier Sara Sanchís and chef Sergio Loris.",
    tagline: "Uncork Your Senses",
    navAll: "All", navBoat: "⚓ Boat Experience", navBreakfast: "Breakfast & Basics", navSnacks: "Snacks & Preserves", navCheese: "Cheese & Charcuterie", navWines: "Wines", navDrinks: "Drinks",
    navEncargo: "✉ On Request",
    search: "Search product…",

let cart = {};
let activeNav = 0;
let lang = "en";

function setLang(l) {
  lang = l;
  document.getElementById("langScreen").classList.add("hidden");
  document.documentElement.lang = l;
  document.getElementById("lswCa").classList.toggle("on", l==="ca");
  document.getElementById("lswEn").classList.toggle("on", l==="en");
  document.getElementById("lswEs").classList.toggle("on", l==="es");
  document.getElementById("lswFr").classList.toggle("on", l==="fr");
  applyTexts();
  buildNav();
  renderSections();
  setMinDelivery();
}

function formatDelivery(val) {
  if (!val) return val;
  try {
    const [y,m,d] = val.split('-');
    const date = new Date(y, m-1, d);
    const locales={ca:'ca-ES',es:'es-ES',en:'en-GB',fr:'fr-FR'};
    return date.toLocaleDateString(locales[lang]||'es-ES', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
  } catch(e) { return val; }
}

function setMinDelivery() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const min = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  const el = document.getElementById("delivery");
  if (el) { el.min = min; el.value = ""; }
}

function onDeliveryDateChange() {
  const dateEl = document.getElementById("delivery");
  const dsSelect = document.getElementById("deliverySlot");
  const sundayNoticeEl = document.getElementById("sundayNotice");
  if (!dateEl || !dsSelect) return;
  let isSunday = false;
  if (dateEl.value) {
    const parts = dateEl.value.split("-").map(Number);
    const d = new Date(parts[0], parts[1]-1, parts[2]);
    isSunday = d.getDay() === 0;
  }
  Array.from(dsSelect.options).forEach(opt => {
    if (opt.value === "") { opt.disabled = false; return; }
    opt.disabled = isSunday && opt.value !== "14:00h en pantalán";
  });
  if (isSunday) {
    dsSelect.value = "14:00h en pantalán";
    if (sundayNoticeEl) sundayNoticeEl.style.display = "block";
  } else {
    if (sundayNoticeEl) sundayNoticeEl.style.display = "none";
  }
}

function buildNav() {
  const t = lang==='fr' ? T_FR : T[lang];
  const navBar = document.getElementById("navBar");
  // Remove old nav buttons (keep lang switch)
  const lswitch = navBar.querySelector(".lang-switch");
  navBar.innerHTML = "";
  NAV_KEYS.forEach((key,i) => {
    const btn = document.createElement("button");
    btn.className = "nbtn" + (i===activeNav?" on":"");
    btn.textContent = t[key];
    btn.onclick = () => {
      activeNav = i;
      document.querySelectorAll(".nbtn").forEach(b=>b.classList.remove("on"));
      btn.classList.add("on");
      renderSections();
    };
    navBar.appendChild(btn);
  });
  navBar.appendChild(lswitch);
}

function renderSections() {
  const t = lang==='fr' ? T_FR : T[lang];
  const q = document.getElementById("searchInput").value.toLowerCase();
  const main = document.getElementById("sectionsMain");
  main.innerHTML = "";
  const navIds = NAV_IDS[activeNav];

  const visible = CATALOG.filter(s => {
    if (navIds && !navIds.includes(s.id)) return false;
    if (!q) return true;
    return s.category.toLowerCase().includes(q) || s.items.some(it=>it.name.toLowerCase().includes(q));
  });

  if (visible.length === 0) {
    main.innerHTML = '<p style="font-style:italic;color:#8A9088;padding:40px 0;text-align:center;">—</p>';
    return;
  }

  visible.forEach(sec => {
    const isJewel = !!sec.isjewel;
    const tLang = lang==='fr' ? T_FR : T[lang];
    const catName = (tLang && tLang.cats && tLang.cats[sec.category]) ? tLang.cats[sec.category] : sec.category;
    const noteText = sec.note ? ((tLang && tLang.notes && tLang.notes[sec.note]) ? tLang.notes[sec.note] : sec.note) : null;
    const div = document.createElement("div");
    div.className = "card";
    let html = `<div class="snum">N° ${sec.id}</div><div class="stitle">${catName}</div>`;
    if (isJewel) {
      html += `<div style="background:rgba(60,15,18,.05);border-left:3px solid #3C0F12;padding:11px 15px;font-style:italic;font-size:13px;color:#3C0F12;margin-bottom:14px;">${t.jewNote}</div>`;
      html += `<div style="background:#3C0F12;color:#F2D3B1;padding:8px 15px;font-family:'Raleway',sans-serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;display:inline-block;">${t.limitedStock}</div>`;
    }
    if (noteText) html += `<div class="sec-note">${noteText}</div>`;
    sec.items.forEach((item, itemIdx) => {
      const key = sec.id+"||"+item.name;
      const qty = cart[key]||0;
      const priceStr = item.price !== null ? fmt(item.price) : t.consultLabel;
      const safeKey = encodeURIComponent(key);
      const ctrl = qty===0
        ? `<button class="abtn" data-secid="${sec.id}" data-itemidx="${itemIdx}" onclick="addItemByIdx(this)">${t.addBtn}</button>`
        : `<div class="qctrl">
             <button class="qbtn" data-key="${safeKey}" data-qty="${qty-1}" onclick="setQtyByKey(this)">−</button>
             <span class="qval">${qty}</span>
             <button class="qbtn" data-key="${safeKey}" data-qty="${qty+1}" onclick="setQtyByKey(this)">+</button>
           </div>`;
      const displayName = (tLang && tLang.products && tLang.products[item.name]) ? tLang.products[item.name] : item.name;
      const bestTagHtml = item.best ? `<span style="display:inline-block;background:#C9A96E;color:#1C2820;font-family:'Raleway',sans-serif;font-size:9px;letter-spacing:.06em;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:8px;vertical-align:middle;">${t.bestTag}</span>` : "";
      html += `<div class="irow"><span class="iname">${displayName}${bestTagHtml}</span><span class="iprice">${priceStr}</span>${ctrl}</div>`;
    });

    div.innerHTML = html;
    // Add images separately to avoid innerHTML size issues
    if (sec.img1 && sec.img2) {
      const imgWrap = document.createElement("div");
      imgWrap.className = "sec-img-pair";
      imgWrap.innerHTML = `<img src="${sec.img1}" alt="${catName}" loading="lazy" decoding="async"><img src="${sec.img2}" alt="${catName}" loading="lazy" decoding="async">`;
      div.insertBefore(imgWrap, div.querySelector(".irow"));
    } else if (sec.img1) {
      const img = document.createElement("img");
      img.className = "sec-img";
      img.loading = "lazy"; img.decoding = "async";
      img.src = sec.img1;
      img.alt = catName;
      div.insertBefore(img, div.querySelector(".irow"));
    }
    main.appendChild(div);
  });
}

function addItemByIdx(btn) {
  const secId = btn.dataset.secid;
  const itemIdx = parseInt(btn.dataset.itemidx);
  const sec = CATALOG.find(s=>s.id===secId);
  if (!sec) return;
  const item = sec.items[itemIdx];
  if (!item) return;
  const key = secId+"||"+item.name;
  cart[key] = (cart[key]||0)+1;
  updateCart();
  renderSections();
}

function setQtyByKey(btn) {
  const key = decodeURIComponent(btn.dataset.key);
  const qty = parseInt(btn.dataset.qty);
  setQty(key, qty);
}

function addItem(secId, name) {
  const key = secId+"||"+name;
  cart[key] = (cart[key]||0)+1;
  updateCart();
  renderSections();
}

function setQty(key, qty) {
  if (qty<=0) delete cart[key];
  else cart[key]=qty;
  updateCart();
  renderSections();
  renderDrawer();
}

function updateCart() {
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const fab = document.getElementById("cartFab");
  document.getElementById("cartBadge").textContent = count;
  fab.style.display = count>0 ? "flex" : "none";
  renderDrawer();
}

function getItem(key) {
  const [secId, name] = key.split("||");
  const sec = CATALOG.find(s=>s.id===secId);
  return sec ? sec.items.find(i=>i.name===name) : null;
}

function cartTotal() {
  return Object.entries(cart).reduce((acc,[key,qty])=>{
    const it=getItem(key); return acc+(it?.price?it.price*qty:0);
  },0);
}

function renderDrawer() {
  const t = lang==='fr' ? T_FR : T[lang];
  const body = document.getElementById("drawerBody");
  const foot = document.getElementById("drawerFoot");
  const entries = Object.entries(cart).filter(([,q])=>q>0);

  if (entries.length===0) {
    body.innerHTML=`<p style="font-style:italic;color:#8A9088;text-align:center;margin-top:40px;">${t.emptyCart}</p>`;
    foot.innerHTML="";
    return;
  }

  body.innerHTML = entries.map(([key,qty])=>{
    const it=getItem(key);
    const safeKey = encodeURIComponent(key);
    return `<div class="ci">
      <div style="flex:1"><div class="ci-name">${it?.name||key.split("||")[1]}</div>
      <div class="ci-price">${it?.price?fmt(it.price*qty):t.consultLabel}</div></div>
      <div class="qctrl">
        <button class="qbtn" data-key="${safeKey}" data-qty="${qty-1}" onclick="setQtyByKey(this)">−</button>
        <span class="qval">${qty}</span>
        <button class="qbtn" data-key="${safeKey}" data-qty="${qty+1}" onclick="setQtyByKey(this)">+</button>
      </div></div>`;
  }).join("");

  foot.innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:14px;">
      <span style="font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8A9088;">${t.totalLbl}</span>
      <span style="font-family:'Raleway',sans-serif;font-size:18px;font-weight:700;color:#3C0F12;">${fmt(cartTotal())}</span>
    </div>
    <button onclick="goCheckout()" style="background:#3C0F12;color:#fff;border:none;width:100%;padding:13px;font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;cursor:pointer;">${t.checkoutBtn}</button>
    <button onclick="clearCart()" style="background:none;border:none;width:100%;padding:9px;font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8A9088;cursor:pointer;margin-top:4px;">${t.clearCart}</button>`;
}

function clearCart() { cart={}; updateCart(); closeDrawer(); }
function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("overlay").classList.add("on"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("overlay").classList.remove("on"); }

function goCheckout() {
  closeDrawer();
  document.getElementById("catalogWrap").classList.add("off");
  document.getElementById("checkoutWrap").classList.add("on");
  document.getElementById("cartFab").style.display="none";
  renderSummary();
  setMinDelivery();
  window.scrollTo({top:0,behavior:"smooth"});
}

function showCatalog() {
  document.getElementById("catalogWrap").classList.remove("off");
  document.getElementById("checkoutWrap").classList.remove("on");
  updateCart();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderSummary() {
  const t = lang==='fr' ? T_FR : T[lang];
  const entries = Object.entries(cart).filter(([,q])=>q>0);
  const div = document.getElementById("orderSummary");
  let html = `<p style="font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8A9088;margin-bottom:10px;">${t.summaryLbl}</p>`;
  entries.forEach(([key,qty])=>{
    const it=getItem(key);
    html+=`<div class="sum-row"><span>${qty}× ${it?.name||key.split("||")[1]}</span><span style="font-family:'Raleway',sans-serif;font-size:12px;color:#3C0F12;font-weight:500;">${it?.price?fmt(it.price*qty):t.consultLabel}</span></div>`;
  });
  html+=`<div class="sum-total"><span style="font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;">${t.totalLbl}</span><span style="font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:#3C0F12;">${fmt(cartTotal())}</span></div>`;
  div.innerHTML=html;
}

function sendEmail() {
  const t = lang==='fr' ? T_FR : T[lang];
  const deliveryMethod = document.getElementById("deliveryMethod").value;
  const boat = document.getElementById("boatName").value.trim();
  const marinaSelect = document.getElementById("marina");
  const marina = marinaSelect.value.trim();
  const marinaEmail = marinaSelect.options[marinaSelect.selectedIndex]?.dataset?.email || "";
  const marinaEmail2 = marinaSelect.options[marinaSelect.selectedIndex]?.dataset?.email2 || "";
  const delivery = document.getElementById("delivery").value.trim();
  const deliverySlot = document.getElementById("deliverySlot").value.trim();
  const pax = document.getElementById("pax").value.trim();
  const notes = document.getElementById("notes").value.trim();

  if (!deliveryMethod) { alert(t.alertDeliveryMethod); return; }
  if (!boat) { alert(t.alertBoat); return; }
  if (!marina || marina === "") { alert(t.alertMarina); return; }
  if (!delivery) { alert(t.alertDelivery); return; }
  if (!deliverySlot) { alert(t.alertDelivery); return; }

  const entries = Object.entries(cart).filter(([,q])=>q>0);
  const itemsText = entries.map(([key,qty])=>{
    const it=getItem(key);
    return "• " + qty + "x " + (it?.name||key.split("||")[1]) + " — " + (it?.price?fmt(it.price*qty):t.consultLabel);
  }).join("\n");

  const overlay = document.createElement("div");
  overlay.className = "sending-overlay";
  overlay.innerHTML = "<p>" + (lang==="fr"?"Envoi en cours...":lang==="en"?"Sending...":"Enviando...") + "</p>";
  document.body.appendChild(overlay);

  emailjs.send("service_unk3z0e", "template_xlsk8rb", {
    marina: marina,
    marina_email: marinaEmail,
    marina_email2: marinaEmail2,
    boat_name: boat,
    delivery_method: deliveryMethod,
    delivery: delivery + (deliverySlot ? " — " + deliverySlot : ""),
    delivery_slot: deliverySlot,
    pax: pax || "—",
    order_items: itemsText,
    total: fmt(cartTotal()),
    notes: notes || "—",
    to_email: marinaEmail || "info@dorigen-menorca.com",
  }).then(function() {
    document.body.removeChild(overlay);
    const t2 = lang==="fr" ? T_FR : T[lang];
    const payMsg = document.getElementById("marina")?.value === "Marina Port Mahón"
      ? "\n\n💳 " + t2.paymentReminder : "";
    alert((lang==="fr"
      ? "Commande envoyée par email avec succès!"
      : lang==="en"
      ? "Order sent by email successfully!"
      : "Pedido enviado por email correctamente.") + payMsg);
    cart = {};
    updateCart();
    document.getElementById("boatName").value = "";
    document.getElementById("marina").value = "";
    document.getElementById("delivery").value = "";
    document.getElementById("deliverySlot").value = "";
    document.getElementById("pax").value = "";
    document.getElementById("notes").value = "";
    showCatalog();
  }).catch(function(err) {
    document.body.removeChild(overlay);
    console.error("EmailJS error:", JSON.stringify(err));
    const errMsg = err && err.text ? err.text : JSON.stringify(err);
    alert((lang==="fr"
      ? "Erreur: "
      : lang==="en"
      ? "Error: "
      : "Error: ") + errMsg);
  });
}


function sendWhatsApp() {
  const t = lang==='fr' ? T_FR : T[lang];
  const boat = document.getElementById("boatName").value.trim();
  const marinaSelect = document.getElementById("marina");
  const marina = marinaSelect.value.trim();
  const marinaEmail = marinaSelect.options[marinaSelect.selectedIndex]?.dataset?.email || "";
  const marinaEmail2 = marinaSelect.options[marinaSelect.selectedIndex]?.dataset?.email2 || "";
  const delivery = document.getElementById("delivery").value.trim();
  const deliverySlot = document.getElementById("deliverySlot").value.trim();
  const pax = document.getElementById("pax").value.trim();
  const notes = document.getElementById("notes").value.trim();

  const deliveryMethod = document.getElementById("deliveryMethod").value;
  if (!deliveryMethod) { alert(t.alertDeliveryMethod); return; }
  if (!boat) { alert(t.alertBoat); return; }
  if (!marina || marina === "") { alert(t.alertMarina); return; }
  if (!delivery) { alert(t.alertDelivery); return; }
  if (!deliverySlot) { alert(t.alertDelivery); return; }
  // Sin restricción bloqueante de 24h — franjas horarias gestionadas internamente por D'Origen

  const entries = Object.entries(cart).filter(([,q])=>q>0);
  const lines = entries.map(([key,qty])=>{
    const it=getItem(key);
    return `• ${qty}× ${it?.name||key.split("||")[1]}  (${it?.price?fmt(it.price*qty):t.consultLabel})`;
  }).join("\n");

  const msg = [
    t.waHeader,"",
    `${t.waDeliveryMethod} ${deliveryMethod}`,
    `${t.waBoat} ${boat}`,    `${t.waMarina} ${marina}`,
    `${t.waDelivery} ${formatDelivery(delivery)}${deliverySlot ? " — " + deliverySlot : ""}`,
    pax?`${t.waPax} ${pax}`:null,"",
    t.waProducts, lines,"",
    `${t.waTotal} ${fmt(cartTotal())}`,
    notes?`\n${t.waNotes} ${notes}`:null,"",
    t.waTagline,
    marina === "Marina Port Mahón" ? "" : null,
    marina === "Marina Port Mahón" ? ("💳 " + t.paymentReminder) : null,
  ].filter(x=>x!==null).join("\n");

  // Send email to marina if has email
  if (marinaEmail) {
    const overlay = document.createElement("div");
    overlay.className = "sending-overlay";
    overlay.innerHTML = "<p>Enviando confirmación...</p>";
    document.body.appendChild(overlay);

    const itemsText = entries.map(([key,qty])=>{
      const it=getItem(key);
      return `• ${qty}× ${it?.name||key.split("||")[1]} — ${it?.price?fmt(it.price*qty):t.consultLabel}`;
    }).join("\n");

    emailjs.send("service_unk3z0e", "template_xlsk8rb", {
      marina: marina,
      marina_email: marinaEmail,
      marina_email2: marinaEmail2,
      boat_name: boat,
      delivery_method: deliveryMethod,
      delivery: delivery,
      pax: pax || "—",
      order_items: itemsText,
      total: fmt(cartTotal()),
      notes: notes || "Sin observaciones",
      to_email: marinaEmail,
    }).then(() => {
      document.body.removeChild(overlay);
      // Reset form
      document.getElementById("boatName").value = "";
      document.getElementById("marina").value = "";
      document.getElementById("delivery").value = "";
      document.getElementById("deliverySlot").value = "";
      document.getElementById("pax").value = "";
      document.getElementById("notes").value = "";
      cart = {};
      updateCart();
      window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,"_blank");
      showCatalog();
    }).catch((err) => {
      document.body.removeChild(overlay);
      console.error("EmailJS error:", err);
      window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,"_blank");
    });
  } else {
    window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,"_blank");
  }
}
</script>
